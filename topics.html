        let currentStream = 'natural';
        let currentSubject = 'biology';

        function switchStream(stream, event) {
            currentStream = stream;
            
            // Update stream buttons
            document.querySelectorAll('.stream-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Set default subject for the stream
            currentSubject = Object.keys(CONCEPT_DATA[stream])[0];
            
            renderSubjectTabs();
            renderPanels();
        }

        function switchSubject(subjectId, event) {
            currentSubject = subjectId;
            
            // Update subject tabs
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            renderPanels();
        }

        function renderSubjectTabs() {
            const container = document.getElementById('subjectTabs');
            container.innerHTML = '';
            
            const subjects = CONCEPT_DATA[currentStream];
            Object.keys(subjects).forEach(key => {
                const sub = subjects[key];
                const btn = document.createElement('button');
                btn.className = `tab-btn ${key === currentSubject ? 'active' : ''}`;
                btn.innerHTML = `${sub.icon} ${sub.name}`;
                btn.onclick = (e) => switchSubject(key, e);
                container.appendChild(btn);
            });
        }

        function renderPanels() {
            const container = document.getElementById('panelsContainer');
            container.innerHTML = '';
            
            const subject = CONCEPT_DATA[currentStream][currentSubject];
            
            subject.themes.forEach(theme => {
                const card = document.createElement('div');
                card.className = 'theme-card';
                
                let rowsHtml = theme.rows.map(row => `
                    <tr>
                        <td data-label="Grade"><span class="grade-badge g${row.grade}">Grade ${row.grade}</span></td>
                        <td data-label="Unit & Curricular Topic">
                            <span class="unit-title">${row.unit}</span>
                        </td>
                        <td data-label="Start Page"><span class="page-marker">${row.page}</span></td>
                        <td data-label="Core Focal Concepts" class="concepts">${row.concepts}</td>
                    </tr>
                `).join('');

                card.innerHTML = `
                    <div class="theme-header">${theme.title}</div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 15%">Grade</th>
                                    <th style="width: 25%">Unit & Curricular Topic</th>
                                    <th style="width: 15%">Start Page</th>
                                    <th style="width: 45%">Core Focal Concepts</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rowsHtml}
                            </tbody>
                        </table>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Initialize
        renderSubjectTabs();
        renderPanels();
    </script>
