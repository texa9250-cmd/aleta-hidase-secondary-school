<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="220" height="48" role="img" aria-label="Aleta Hidase School">

  <!-- Navy disc -->
  <circle cx="24" cy="24" r="22" fill="#0e1a35"/>

  <!-- Ethiopian flag rings (green · yellow · red) -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="#078930" stroke-width="2"/>
  <circle cx="24" cy="24" r="19" fill="none" stroke="#fcdd09" stroke-width="1.5"/>
  <circle cx="24" cy="24" r="16" fill="none" stroke="#da121a" stroke-width="1.5"/>

  <!-- Japan red sun -->
  <circle cx="24" cy="24" r="8" fill="#e63946"/>
  <circle cx="24" cy="24" r="8" fill="none" stroke="#a4161a" stroke-width="0.6"/>

  <!-- School name (light, so it reads on the dark nav) -->
  <text x="56" y="21"
        font-family="system-ui,-apple-system,sans-serif"
        font-size="14" font-weight="800"
        fill="#f4efe9" letter-spacing="0.4">
    አለታ-ህዳሴ
  </text>

  <!-- Subtitle / tagline -->
  <text x="56" y="34"
        font-family="system-ui,-apple-system,sans-serif"
        font-size="7.5" font-weight="600"
        fill="#f08a5d" letter-spacing="2.4">
    SCHOOL · EST. 2005
  </text>

</svg>