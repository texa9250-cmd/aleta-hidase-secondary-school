<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-en="Facility | አለታ ህዳሴ" data-am="ተቋም | አለታ ህዳሴ">Facility | አለታ ህዳሴ</title>
  <script src="/site-effects.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Abyssinica+SIL&family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#0e1a35;--navy2:#1b2d5c;--orange:#f08a5d;--gold:#ffc857;--gray:#64748b;--bg:#f1f5f9;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--navy);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
    .fac-hero{position:relative;overflow:hidden;text-align:center;color:#fff;padding:64px 20px 110px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%)}
    .fac-hero:before,.fac-hero:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
    .fac-hero:before{width:380px;height:380px;right:-110px;top:-150px;border:1px solid rgba(255,255,255,.12);box-shadow:0 0 0 44px rgba(255,255,255,.04),0 0 0 88px rgba(255,255,255,.03)}
    .fac-hero:after{width:240px;height:240px;left:-80px;bottom:-130px;background:rgba(240,138,93,.18)}
    .fac-hero-in{position:relative;z-index:1;max-width:760px;margin:0 auto}
    .fac-back{display:inline-flex;align-items:center;gap:8px;margin-bottom:22px;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--gold);text-decoration:none;font-weight:700;font-size:.9rem;transition:.2s}
    .fac-back:hover{background:rgba(255,255,255,.2);transform:translateX(-4px)}
    .fac-icon{display:block;font-size:3rem;margin-bottom:6px}
    .fac-hero h1{margin:0 0 14px;font:700 clamp(2.3rem,6vw,3.6rem)/1.1 var(--serif)}
    .fac-hero p{margin:0 auto;max-width:600px;color:#cbd5e1;font-size:clamp(1rem,2vw,1.2rem);line-height:1.6}
    .fac-count{display:inline-block;margin-top:18px;padding:5px 16px;border-radius:999px;background:rgba(255,200,87,.18);color:var(--gold);font-weight:700;font-size:.85rem}
    .fac-main{max-width:1150px;margin:-64px auto 70px;padding:0 20px;position:relative;z-index:2}
    .fac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:24px}
    .fac-card{position:relative;margin:0;padding:0;border:0;text-align:left;font:inherit;cursor:pointer;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 10px 36px rgba(14,26,53,.1);border:1px solid #e2e8f0;transition:transform .3s,box-shadow .3s;animation:fac-in .45s ease both}
    .fac-card:before{content:"";position:absolute;z-index:2;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--orange),var(--gold))}
    .fac-card:hover{transform:translateY(-8px);box-shadow:0 20px 48px rgba(14,26,53,.18)}
    .fac-img{position:relative;aspect-ratio:4/3;background:#e2e8f0;overflow:hidden}
    .fac-img img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .6s}
    .fac-card:hover .fac-img img{transform:scale(1.07)}
    .fac-img:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(14,26,53,.55) 0%,transparent 45%);pointer-events:none}
    .fac-zoom{position:absolute;z-index:1;right:12px;bottom:12px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);font-size:1.05rem}
    .fac-cap{padding:14px 18px 18px;color:var(--gray);line-height:1.5;min-height:56px}
    .fac-cap b{display:block;color:var(--navy);font:700 1.05rem var(--serif);margin-bottom:2px}
    .fac-state{max-width:560px;margin:0 auto;padding:46px 26px;text-align:center;background:#fff;border-radius:22px;box-shadow:0 10px 36px rgba(14,26,53,.1);border:1px solid #e2e8f0}
    .fac-state .big{font-size:3rem}
    .fac-state h2{margin:8px 0;font:700 1.5rem var(--serif)}
    .fac-state p{margin:0 0 18px;color:var(--gray);line-height:1.6}
    .fac-pick{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
    .fac-pick a{padding:10px 20px;border-radius:999px;background:var(--navy);color:#fff;text-decoration:none;font-weight:700}
    .fac-pick a:hover{background:var(--orange)}
    dialog.fac-box{border:0;padding:0;background:transparent;max-width:min(1000px,96vw);max-height:94vh;overflow:visible;color:#fff}
    dialog.fac-box::backdrop{background:rgba(6,12,28,.88);backdrop-filter:blur(4px)}
    .fac-box figure{margin:0;text-align:center}
    .fac-box img{display:block;max-width:96vw;max-height:78vh;margin:0 auto;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#000}
    .fac-box figcaption{margin-top:12px;font-size:1.05rem;color:#e2e8f0}
    .fac-box figcaption small{display:block;margin-top:4px;color:#94a3b8}
    .fac-btn{position:fixed;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:1.4rem;cursor:pointer}
    .fac-btn:hover{background:var(--orange)}
    .fac-prev{left:14px}.fac-next{right:14px}
    .fac-close{position:fixed;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:1.2rem;cursor:pointer}
    .fac-close:hover{background:var(--orange)}
    @keyframes fac-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @media(max-width:600px){.fac-hero{padding:48px 18px 90px}.fac-main{margin-top:-52px}.fac-grid{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){.fac-card,.fac-img img{animation:none;transition:none}}
  </style>
</head>
<body>
<div id="site-header"></div>
<script src="/site-nav.js"></script>
<script>if (window.mountSiteNav) mountSiteNav('#site-header', {});</script>

<div id="fac-page">
  <section class="fac-hero hero"><div class="fac-hero-in">
    <a class="fac-back" href="/index.html" data-en="← Back to Home" data-am="← ወደ መነሻ ገጽ ተመለስ">← Back to Home</a>
    <span class="fac-icon" id="fac-icon"></span>
    <h1 id="fac-title">Loading...</h1>
    <p id="fac-desc"></p>
    <span class="fac-count" id="fac-count" hidden></span>
  </div></section>
  <main class="fac-main" id="fac-main"></main>
</div>
<dialog class="fac-box" id="fac-box" aria-label="Photo viewer"></dialog>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const id = new URLSearchParams(location.search).get('id');
  const main = $('fac-main'); let photos = [], title = '', at = 0;
  const state = (big, h, p, extra) => { main.innerHTML = `<div class="fac-state"><div class="big">${big}</div><h2>${h}</h2><p>${p}</p>${extra || ''}</div>`; };

  async function get(url) {
    const r = await fetch(url);
    if (r.status === 404 && !(r.headers.get('content-type') || '').includes('json')) throw new Error('missing');
    const d = await r.json().catch(() => null);
    if (!r.ok) throw Object.assign(new Error((d && d.error) || 'failed'), {status: r.status});
    return d;
  }
  async function pickPage() {                                   // no id in the address: let the visitor choose
    $('fac-title').textContent = 'Our facilities'; $('fac-desc').textContent = 'Choose a facility to see its photos.';
    try {
      const list = await get('/api/campus/facilities');
      main.innerHTML = '<div class="fac-state"><div class="big">🏫</div><h2>Choose a facility</h2><p>See photos of our campus.</p><div class="fac-pick">' +
        list.map(f => `<a href="facility-detail.html?id=${f.id}">${esc(f.icon)} ${esc(f.title)}</a>`).join('') + '</div></div>';
    } catch (e) { state('⚠️', 'The gallery is not available', 'Please try again later.'); }
  }
  function show(i) {
    at = (i + photos.length) % photos.length; const p = photos[at], box = $('fac-box');
    box.innerHTML = `<button class="fac-close" data-x aria-label="Close">✕</button>${photos.length > 1 ? '<button class="fac-btn fac-prev" data-d="-1" aria-label="Previous photo">‹</button><button class="fac-btn fac-next" data-d="1" aria-label="Next photo">›</button>' : ''}
      <figure><img src="${esc(p.url)}" alt="${esc(p.caption || title)}"><figcaption>${esc(p.caption || title)}<small>${at + 1} / ${photos.length}</small></figcaption></figure>`;
    if (!box.open) box.showModal();
  }
  async function load() {
    if (!id) return pickPage();
    try {
      const f = await get('/api/campus/facilities/' + encodeURIComponent(id));
      title = f.title; photos = f.photos; document.title = f.title + ' | አለታ ህዳሴ';
      $('fac-icon').textContent = f.icon || '🏫'; $('fac-title').textContent = f.title; $('fac-desc').textContent = f.description || '';
      $('fac-count').hidden = !photos.length; $('fac-count').textContent = `📷 ${photos.length} ${photos.length === 1 ? 'photo' : 'photos'}`;
      if (!photos.length) return state('📷', 'Photos are coming soon', 'The school has not added photos of this facility yet. Please check back later.', '<div class="fac-pick"><a href="/index.html">← Back to Home</a></div>');
      main.innerHTML = '<div class="fac-grid">' + photos.map((p, i) => `<button class="fac-card" data-i="${i}" style="animation-delay:${Math.min(i, 8) * 60}ms" aria-label="Open photo ${i + 1}">
        <div class="fac-img"><img src="${esc(p.url)}" alt="${esc(p.caption || f.title)}" loading="lazy"><span class="fac-zoom" aria-hidden="true">⤢</span></div>
        <div class="fac-cap"><b>${esc(f.title)}</b>${esc(p.caption || '')}</div></button>`).join('') + '</div>';
    } catch (e) {
      $('fac-title').textContent = 'Facility';
      if (e.status === 404) { $('fac-title').textContent = 'Facility not found'; return pickPage().then(() => { $('fac-title').textContent = 'Facility not found'; $('fac-desc').textContent = 'Please choose one of the facilities below.'; }); }
      state('⚠️', 'The gallery could not load', e.message === 'missing' ? 'The school server needs the photo gallery update (facilities-routes.js).' : 'Please check your connection and try again.', '<div class="fac-pick"><a href="javascript:location.reload()">Try again</a></div>');
    }
  }
  main.addEventListener('click', e => { const c = e.target.closest('[data-i]'); if (c) show(Number(c.dataset.i)); });
  $('fac-box').addEventListener('click', e => { const t = e.target; if (t === $('fac-box') || t.closest('[data-x]')) $('fac-box').close(); else if (t.closest('[data-d]')) show(at + Number(t.closest('[data-d]').dataset.d)); });
  document.addEventListener('keydown', e => { if (!$('fac-box').open) return; if (e.key === 'ArrowRight') show(at + 1); if (e.key === 'ArrowLeft') show(at - 1); });
  load();
})();
</script>
</body>
</html>
