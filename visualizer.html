<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title data-en="Visual study lab | አለታ ህዳሴ" data-am="የእይታ የጥናት ላብ | አለታ ህዳሴ">Visual study lab | አለታ ህዳሴ</title>
<script src="/site-effects.js"></script>
<style>
:root{--bg:#0a1029;--bg2:#101a3d;--card:#131d42;--line:#26346a;--ink:#eef1ff;--muted:#9aa7d4;--acc:#ff8a5b;--acc2:#ffc857;--blue:#5ec2ff;--green:#6ee7b7}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#1b2a66 0,transparent 60%),var(--bg);color:var(--ink);font:400 1rem/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.wrap{max-width:62rem;margin:0 auto;padding:1.2rem 1.1rem 3rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.top a{color:var(--acc2);text-decoration:none;font-weight:600}
.top a:hover{text-decoration:underline}
h1{margin:.2rem 0 .3rem;font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.15}
h1 span{color:var(--acc)}
.sub{color:var(--muted);margin:0 0 1.2rem;max-width:42rem}
.tabs{display:flex;gap:.55rem;flex-wrap:wrap;margin-bottom:1rem}
.tab{font:600 .95rem system-ui,sans-serif;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.55rem 1rem;cursor:pointer;transition:transform .15s,background .15s}
.tab:hover{transform:translateY(-2px)}
.tab[aria-selected="true"]{background:var(--acc);color:#1b1020;border-color:var(--acc)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 18.5rem;gap:1rem;align-items:start}
@media(max-width:52rem){.stage{grid-template-columns:1fr}}
.panel{background:linear-gradient(180deg,var(--card),#0f1836);border:1px solid var(--line);border-radius:18px;padding:1rem}
.canvaswrap{padding:.6rem}
canvas{display:block;width:100%;border-radius:12px;background:#0c1432}
.head{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin:.2rem 0 .5rem}
.head h2{margin:0;font-size:1.25rem}
.pill{font-size:.78rem;font-weight:700;color:#1b1020;background:var(--acc2);padding:.1rem .6rem;border-radius:999px}
.blurb{color:var(--muted);margin:.2rem 0 .8rem}
.ctl{display:block;margin:.7rem 0}
.ctl span{display:flex;justify-content:space-between;font-weight:600;font-size:.92rem;margin-bottom:.2rem}
.ctl output{color:var(--acc2);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc)}
.grp{margin:.8rem 0}
.grp>b{display:block;font-size:.88rem;margin-bottom:.35rem}
.opts{display:flex;gap:.4rem;flex-wrap:wrap}
.opt,.act{font:600 .88rem system-ui,sans-serif;color:var(--ink);background:#1a2552;border:1px solid var(--line);border-radius:10px;padding:.45rem .8rem;cursor:pointer}
.opt[aria-pressed="true"]{background:var(--blue);color:#07142a;border-color:var(--blue)}
.act{background:var(--acc);color:#1b1020;border-color:var(--acc);margin-top:.3rem}
.act:hover{filter:brightness(1.08)}
.read{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.55rem;margin-top:.9rem}
.read div{background:#0e1738;border:1px solid var(--line);border-radius:12px;padding:.5rem .7rem}
.read small{display:block;color:var(--muted);font-size:.76rem;text-transform:uppercase;letter-spacing:.04em}
.read b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.task{margin-top:1rem;border-left:4px solid var(--acc);background:#16214b;border-radius:0 12px 12px 0;padding:.7rem .9rem}
.task b{color:var(--acc2)}
</style></head>
<body>
<div class="wrap">
  <div class="top"><a id="back" href="students.html" data-en="← Back to my study space" data-am="← ወደ ጥናት ቦታዬ ተመለስ">&larr; Back to my study space</a><a href="../index.html" data-en="School site" data-am="የትምህርት ቤቱ ድረ-ገጽ">School site</a></div>
  <h1><span data-en="Visual study lab" data-am="የእይታ የጥናት ላብ">Visual study lab</span></h1>
  <p class="sub" data-en="Move the sliders and watch the idea change. Seeing a graph, a flight or a current in motion makes it easier to remember than reading a formula." data-am="ማንሸራተቻዎቹን ያንቀሳቅሱና ሃሳቡ ሲቀየር ይመልከቱ። ግራፍን፣ በረራን ወይም የኤሌክትሪክ ፍሰትን በእንቅስቃሴ ማየት ቀመር ከማንበብ ይልቅ ለማስታወስ ያግዛል።">Move the sliders and watch the idea change. Seeing a graph, a flight or a current in motion makes it easier to remember than reading a formula.</p>
  <div class="tabs" id="tabs" role="tablist" aria-label="Choose a tool" data-en-aria-label="Choose a tool" data-am-aria-label="መሣሪያ ይምረጡ"></div>
  <div class="stage">
    <div class="panel canvaswrap"><canvas id="cv" role="img" aria-label="Animation" data-en-aria-label="Animation" data-am-aria-label="እነማ"></canvas>
      <div class="read" id="read" aria-live="polite"></div></div>
    <div class="panel">
      <div class="head"><h2 id="tname"></h2><span class="pill" id="tsub"></span></div>
      <p class="blurb" id="tblurb"></p>
      <div id="controls"></div>
      <div class="task"><b data-en="Try this:" data-am="ይህን ይሞክሩ፦">Try this:</b> <span id="ttask"></span></div>
    </div>
  </div>
</div>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const TAU = Math.PI * 2, ACC = '#ff8a5b', ACC2 = '#ffc857', BLUE = '#5ec2ff', GREEN = '#6ee7b7', INK = '#eef1ff', MUTED = '#8f9bc4', GRID = 'rgba(150,170,240,.14)';
  const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const n = (x, d = 2) => String(Math.abs(x) < 1e-9 ? 0 : +x.toFixed(d));

  /* back link keeps the grade and level */
  const P = new URLSearchParams(location.search);
  if (['9', '10', '11'].includes(P.get('grade'))) $('#back').href = 'grade.html?grade=' + P.get('grade') + (P.get('level') ? '&level=' + P.get('level') : '');

  const cv = $('#cv'), ctx = cv.getContext('2d');
  let locale = localStorage.getItem('site_lang') === 'am' ? 'am' : 'en';
  let W = 600, H = 360;
  function resize() {
    W = cv.parentElement.clientWidth - 20;
    H = Math.round(W < 480 ? W * 0.85 : Math.min(W * 0.58, 430));
    const d = window.devicePixelRatio || 1;
    cv.width = W * d; cv.height = H * d; cv.style.height = H + 'px';
    ctx.setTransform(d, 0, 0, d, 0, 0);
  }

  /* ---------- drawing helpers ---------- */
  function line(x1, y1, x2, y2, c, w, dash) {
    ctx.beginPath(); ctx.setLineDash(dash || []); ctx.strokeStyle = c; ctx.lineWidth = w || 1;
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.setLineDash([]);
  }
  function dot(x, y, r, c, glow) {
    ctx.save(); ctx.fillStyle = c; if (glow) { ctx.shadowColor = c; ctx.shadowBlur = glow; }
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.restore();
  }
  function arrow(x1, y1, x2, y2, c) {
    const a = Math.atan2(y2 - y1, x2 - x1);
    line(x1, y1, x2, y2, c, 2.5);
    ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - 9 * Math.cos(a - 0.4), y2 - 9 * Math.sin(a - 0.4));
    ctx.lineTo(x2 - 9 * Math.cos(a + 0.4), y2 - 9 * Math.sin(a + 0.4)); ctx.closePath(); ctx.fill();
  }
  function background() {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#11204d'); g.addColorStop(1, '#0a1030');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  function drawLobes(cx, cy, start, R, nLobes, rgb) {
    for (let i = 0; i < nLobes; i++) {
      const a = start + i * TAU / nLobes;
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(a); ctx.translate(R * 0.55, 0);
      const lg = ctx.createRadialGradient(0, 0, 2, 0, 0, R * 0.5);
      lg.addColorStop(0, 'rgba(' + rgb + ',0.9)'); lg.addColorStop(1, 'rgba(' + rgb + ',0)');
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.ellipse(0, 0, R * 0.42, R * 0.26, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
  }

  const CANVAS_AM = {
    'Parabola': 'ፓራቦላ', 'vertex': 'ጫፍ ነጥብ', 'Earth': 'ምድር', 'Moon': 'ጨረቃ', 'Mars': 'ማርስ',
    'Series': 'ተከታታይ', 'Parallel': 'ትይዩ', 'Current': 'ፍሰት', 'Voltage': 'ቮልቴጅ',
    'sin': 'ሳይን', 'cos': 'ኮሳይን', 'hypotenuse': 'ገመድ', 'opposite': 'ተቃራኒ ጎን', 'adjacent': 'ተቀጣጣይ ጎን',
    'object': 'ነገር', 'image at infinity': 'ምስሉ በማያልቅ ርቀት ላይ ነው', 'real, inverted': 'እውነተኛ፣ የተገለበጠ',
    'virtual, upright': 'ምናባዊ፣ ቀጥ ያለ', 'reactants': 'ምላሽ ሰጪዎች', 'products': 'ምርቶች',
    'transition state': 'የሽግግር ሁኔታ', 'Exothermic': 'ኤግዞተርሚክ', 'Endothermic': 'ኢንዶተርሚክ',
    'reaction progress': 'የምላሽ ሂደት', 'energy': 'ኃይል', 'equivalence': 'እኩልነት', 'pH': 'pH',
    'base added (mL)': 'የተጨመረ ቤዝ (mL)', 'B here': 'B በዚህ', 'I': 'I', 'F': 'F', 'v': 'v',
    'Interphase': 'ኢንተርፌዝ', 'Prophase': 'ፕሮፌዝ', 'Metaphase': 'ሜታፌዝ', 'Anaphase': 'አናፌዝ', 'Telophase': 'ቴሎፌዝ',
    'parent (dashed)  →  transformed': 'ወላጅ (ባለ ተቋራጭ)  →  የተለወጠ', 'unit circle': 'ክፍል ክብ',
    'y = sin θ': 'y = ሳይን θ', 'SOH-CAH-TOA': 'SOH-CAH-TOA', 'θ': 'θ'
  };
  function text(s, x, y, c, size, align) {
    ctx.fillStyle = c || INK; ctx.font = '600 ' + (size || 13) + 'px system-ui,sans-serif'; ctx.textAlign = align || 'left';
    ctx.fillText(locale === 'am' ? (CANVAS_AM[s] || s) : s, x, y);
  }

  /* =====================================================
     TOOL 1: Quadratic explorer
     ===================================================== */
  const quad = {
    id: 'quad', name: 'Quadratic explorer', sub: 'Mathematics',
    blurb: 'Change a, b and c and watch the parabola, its vertex and its roots move.',
    task: 'Make the curve touch the x-axis at exactly one point. What is the discriminant then?',
    v: {a: 1, b: -2, c: -3}, reveal: 0,
    sliders: [{id: 'a', label: 'a', min: -3, max: 3, step: 0.1}, {id: 'b', label: 'b', min: -6, max: 6, step: 0.1}, {id: 'c', label: 'c', min: -8, max: 8, step: 0.1}],
    onChange() { this.reveal = 0; },
    read(v) {
      const {a, b, c} = v, D = b * b - 4 * a * c; let roots;
      if (Math.abs(a) < 0.05) roots = Math.abs(b) < 0.05 ? 'none' : 'x = ' + n(-c / b);
      else if (D < 0) roots = 'no real roots';
      else if (Math.abs(D) < 1e-9) roots = 'x = ' + n(-b / (2 * a)) + ' (one root)';
      else roots = n((-b - Math.sqrt(D)) / (2 * a)) + ' and ' + n((-b + Math.sqrt(D)) / (2 * a));
      const xv = -b / (2 * a), vert = Math.abs(a) < 0.05 ? 'none (a is 0)' : '(' + n(xv) + ', ' + n(a * xv * xv + b * xv + c) + ')';
      return [['Equation', 'y = ' + n(a, 1) + 'x² ' + (b < 0 ? '− ' : '+ ') + n(Math.abs(b), 1) + 'x ' + (c < 0 ? '− ' : '+ ') + n(Math.abs(c), 1)], ['Discriminant', n(D)], ['Roots', roots], ['Vertex', vert], ['Opens', a > 0.05 ? 'upward' : a < -0.05 ? 'downward' : 'a straight line']];
    },
    draw(t, v, dt) {
      const {a, b, c} = v, X0 = -8, X1 = 8, Y0 = -10, Y1 = 10;
      const px = x => (x - X0) / (X1 - X0) * W, py = y => H - (y - Y0) / (Y1 - Y0) * H, f = x => a * x * x + b * x + c;
      for (let x = X0; x <= X1; x += 2) { line(px(x), 0, px(x), H, x === 0 ? '#6d7fc7' : GRID, x === 0 ? 1.6 : 1); if (x && x % 4 === 0) text(x, px(x), py(0) + 14, MUTED, 11, 'center'); }
      for (let y = Y0; y <= Y1; y += 2) { line(0, py(y), W, py(y), y === 0 ? '#6d7fc7' : GRID, y === 0 ? 1.6 : 1); if (y && y % 4 === 0) text(y, px(0) - 6, py(y) + 4, MUTED, 11, 'right'); }
      this.reveal = Math.min(1, this.reveal + (RM ? 1 : dt / 700));
      const xe = X0 + (X1 - X0) * this.reveal;
      if (Math.abs(a) >= 0.05) { const xv = -b / (2 * a); if (xv > X0 && xv < X1) line(px(xv), 0, px(xv), H, 'rgba(255,200,87,.45)', 1.5, [6, 6]); }
      ctx.save(); ctx.beginPath(); ctx.strokeStyle = ACC; ctx.lineWidth = 3.5; ctx.shadowColor = ACC; ctx.shadowBlur = 12; ctx.lineJoin = 'round';
      for (let x = X0, first = true; x <= xe; x += 0.05) { const X = px(x), Y = py(f(x)); first ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y); first = false; }
      ctx.stroke(); ctx.restore();
      if (this.reveal >= 1) {
        const D = b * b - 4 * a * c, pulse = 7 + 3 * Math.sin(t / 250);
        if (Math.abs(a) >= 0.05) {
          const xv = -b / (2 * a), yv = f(xv);
          if (xv > X0 && xv < X1 && yv > Y0 && yv < Y1) { dot(px(xv), py(yv), 6, ACC2, 14); text('vertex', px(xv) + 10, py(yv) - 8, ACC2, 12); }
          if (D >= 0) [(-b - Math.sqrt(D)) / (2 * a), (-b + Math.sqrt(D)) / (2 * a)].forEach(r => {
            if (r > X0 && r < X1) { dot(px(r), py(0), 5, GREEN, 12); ctx.strokeStyle = GREEN; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(px(r), py(0), pulse, 0, TAU); ctx.stroke(); text('x=' + n(r), px(r), py(0) - 14, GREEN, 12, 'center'); }
          });
        } else if (Math.abs(b) >= 0.05) { const r = -c / b; if (r > X0 && r < X1) dot(px(r), py(0), 5, GREEN, 12); }
        const xm = X0 + (X1 - X0) * (0.5 + 0.5 * Math.sin(t / 1800)), ym = f(xm);
        if (ym > Y0 && ym < Y1) { dot(px(xm), py(ym), 6, BLUE, 16); text('(' + n(xm, 1) + ', ' + n(ym, 1) + ')', px(xm) + 10, py(ym) - 10, BLUE, 12); }
      }
    }
  };

  /* =====================================================
     TOOL 2: Projectile lab
     ===================================================== */
  const proj = {
    id: 'proj', name: 'Projectile lab', sub: 'Physics',
    blurb: 'Launch a ball and compare how it flies on Earth, the Moon and Mars.',
    task: 'Which launch angle gives the longest range on Earth? Try 30°, 45° and 60°, then Moon gravity.',
    v: {speed: 30, angle: 45, g: 9.8}, ts: 0, running: false, trail: [], endHold: 0,
    sliders: [{id: 'speed', label: 'Launch speed', min: 5, max: 60, step: 1, unit: ' m/s'}, {id: 'angle', label: 'Angle', min: 5, max: 85, step: 1, unit: '°'}],
    choices: [{id: 'g', label: 'Gravity', opts: [[9.8, 'Earth'], [1.62, 'Moon'], [3.71, 'Mars']]}],
    buttons: [{label: 'Launch again', run() { proj.launch(); }}],
    launch() { this.ts = 0; this.running = true; this.trail = []; },
    onChange() { this.launch(); },
    reset() { this.launch(); },
    stats(v) { const th = v.angle * Math.PI / 180, vx = v.speed * Math.cos(th), vy = v.speed * Math.sin(th); return {vx, vy, T: 2 * vy / v.g, R: vx * 2 * vy / v.g, Hm: vy * vy / (2 * v.g)}; },
    read(v) { const s = this.stats(v); return [['Flight time', n(s.T) + ' s'], ['Range', n(s.R, 1) + ' m'], ['Max height', n(s.Hm, 1) + ' m'], ['Horizontal speed', n(s.vx, 1) + ' m/s']]; },
    draw(t, v, dt) {
      const s = this.stats(v), padL = 44, padR = 36, padB = 46, padT = 46;
      const sc = Math.min(50, (W - padL - padR) / Math.max(s.R, 1), (H - padB - padT) / Math.max(s.Hm, 1));
      const gx = x => padL + x * sc, gy = y => H - padB - y * sc;
      for (let i = 0; i < 40; i++) { const a = Math.sin(i * 91.7) * 0.5 + 0.5, b = Math.sin(i * 37.3) * 0.5 + 0.5; dot(a * W, b * (H - padB - 10), 1 + a, 'rgba(255,255,255,.35)'); }
      ctx.fillStyle = '#1b2d63'; ctx.fillRect(0, gy(0), W, H - gy(0)); line(0, gy(0), W, gy(0), '#6d7fc7', 2);
      for (let x = 0; x <= s.R + 0.01; x += Math.max(5, Math.round(s.R / 6 / 5) * 5)) { line(gx(x), gy(0), gx(x), gy(0) + 6, MUTED, 1); text(Math.round(x) + ' m', gx(x), gy(0) + 20, MUTED, 11, 'center'); }
      ctx.save(); ctx.beginPath(); ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.setLineDash([6, 7]); ctx.lineWidth = 1.5;
      for (let i = 0; i <= 80; i++) { const tt = s.T * i / 80, X = gx(s.vx * tt), Y = gy(s.vy * tt - 0.5 * v.g * tt * tt); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }
      ctx.stroke(); ctx.restore();
      dot(gx(s.R / 2), gy(s.Hm), 4, ACC2, 8); text('top: ' + n(s.Hm, 1) + ' m', gx(s.R / 2), gy(s.Hm) - 12, ACC2, 12, 'center');
      if (this.running) { this.ts += dt / 1000 * (s.T / (RM ? 0.6 : 2.6)); if (this.ts >= s.T) { this.ts = s.T; this.running = false; } }
      const x = s.vx * this.ts, y = Math.max(0, s.vy * this.ts - 0.5 * v.g * this.ts * this.ts);
      if (this.running || !this.trail.length) this.trail.push([x, y]);
      this.trail.forEach((p, i) => dot(gx(p[0]), gy(p[1]), 2 + 3 * i / this.trail.length, 'rgba(255,138,91,' + (0.15 + 0.6 * i / this.trail.length) + ')'));
      if (this.running) {
        const vyNow = s.vy - v.g * this.ts; arrow(gx(x), gy(y), gx(x) + s.vx * 2.2, gy(y) - vyNow * 2.2, GREEN);
        text('speed ' + n(Math.hypot(s.vx, vyNow), 1) + ' m/s', gx(x) + 14, gy(y) - 14, GREEN, 12);
      }
      dot(gx(x), gy(y), 9, ACC, 20);
      if (!this.running && this.ts >= s.T) { text('landed ' + n(s.R, 1) + ' m away', gx(s.R), gy(0) - 14, ACC2, 13, 'center'); }
    }
  };

  /* =====================================================
     TOOL 3: Circuit flow
     ===================================================== */
  const circ = {
    id: 'circ', name: 'Circuit flow', sub: 'Physics',
    blurb: 'Dots show the current. The faster they move, the larger the current in that wire.',
    task: 'Switch between series and parallel with the same resistors. Which gives the larger total current?',
    v: {volts: 12, r1: 4, r2: 6, mode: 'series'}, off: [0, 0],
    sliders: [{id: 'volts', label: 'Battery', min: 1, max: 24, step: 1, unit: ' V'}, {id: 'r1', label: 'Resistor R1', min: 1, max: 20, step: 1, unit: ' Ω'}, {id: 'r2', label: 'Resistor R2', min: 1, max: 20, step: 1, unit: ' Ω'}],
    choices: [{id: 'mode', label: 'Connection', opts: [['series', 'Series'], ['parallel', 'Parallel']], text: true}],
    calc(v) {

    'Parent function': 'የመሠረት ተግባር', 'Amplitude': 'ስፋት', 'Reflection': 'ነጸብራቅ',
    'Current I': 'ፍሰት I', 'Distance r': 'ርቀት r', 'B = μ₀I / (2πr)': 'B = μ₀I / (2πr)',
    'Moles n': 'ሞሎች n', 'Temperature T': 'ሙቀት T', 'Volume V': 'መጠን V', 'P = nRT / V': 'P = nRT / V', 'P in kPa': 'P በkPa', 'Gas constant R': 'የጋዝ ቋሚ R'
  };

  let cur = TOOLS[0];
  const toolText = (key, value) => {
    if (locale !== 'am') return value;
    const tx = VAM[cur.id] || {};
    return (tx[key] || {})[value] || (tx.values || {})[value] || (tx.choices || {})[value] || (tx.buttons || {})[value] || VAM_VALUES[value] || value;
  };
  function renderRead() { $('#read').innerHTML = cur.read(cur.v).map(r => '<div><small>' + toolText('reads', r[0]) + '</small><b>' + toolText('values', r[1]) + '</b></div>').join(''); }
  function fmt(s, val) { return (+val % 1 ? n(+val, 1) : val) + (s.unit || ''); }
  function syncSlider(id) {
    const inp = document.getElementById('c_' + id), out = document.getElementById('o_' + id);
    if (!inp) return;
    const s = (cur.sliders || []).find(x => x.id === id);
    inp.value = cur.v[id];
    if (out && s) out.textContent = fmt(s, inp.value);
  }
  function syncChoice(id) { document.querySelectorAll('[data-ch="' + id + '"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.val) === String(cur.v[id]))); }
  function buildControls() {
    const box = $('#controls'); box.innerHTML = '';
    (cur.sliders || []).forEach(s => {
      const l = document.createElement('label'); l.className = 'ctl';
      l.innerHTML = '<span>' + toolText('controls', s.id) + '<output id="o_' + s.id + '"></output></span><input type="range" id="c_' + s.id + '" min="' + s.min + '" max="' + s.max + '" step="' + s.step + '" value="' + cur.v[s.id] + '">';
      box.append(l);
      const inp = l.querySelector('input'), out = l.querySelector('output');
      out.textContent = fmt(s, inp.value);
      inp.addEventListener('input', () => {
        cur.v[s.id] = +inp.value;
        out.textContent = fmt(s, inp.value);
        if (s.id === 'angle' && cur.id === 'wave') { cur.v.auto = 0; syncChoice('auto'); }
        if (cur.onChange) cur.onChange();
        renderRead();
      });
    });
    (cur.choices || []).forEach(ch => {
      const g = document.createElement('div'); g.className = 'grp'; g.innerHTML = '<b>' + toolText('controls', ch.label) + '</b><div class="opts"></div>'; box.append(g);
      ch.opts.forEach(o => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.textContent = toolText('choices', o[1]); b.dataset.ch = ch.id; b.dataset.val = o[0];
        b.addEventListener('click', () => {
          cur.v[ch.id] = ch.text ? o[0] : +o[0];
          syncChoice(ch.id);
          if (cur.onChange) cur.onChange();
          renderRead();
        });
        g.querySelector('.opts').append(b);
      });
      syncChoice(ch.id);
    });
    (cur.buttons || []).forEach(bt => { const b = document.createElement('button'); b.type = 'button'; b.className = 'act'; b.textContent = toolText('buttons', bt.label); b.addEventListener('click', bt.run); box.append(b); });
  }
  function updateToolText(tool) {
    const tx = VAM[tool.id] || {};
    $('#tname').textContent = locale === 'am' ? tx.name || tool.name : tool.name;
    $('#tsub').textContent = locale === 'am' ? tx.sub || ({Mathematics: 'ሒሳብ', Physics: 'ፊዚክስ', Chemistry: 'ኬሚስትሪ', Biology: 'ባዮሎጂ', Economics: 'ኢኮኖሚክስ', Geography: 'ጂኦግራፊ'}[tool.sub] || tool.sub) : tool.sub;
    $('#tblurb').textContent = locale === 'am' ? tx.blurb || tool.blurb : tool.blurb;
    $('#ttask').textContent = locale === 'am' ? tx.task || tool.task : tool.task;
    cv.setAttribute('aria-label', (locale === 'am' ? tx.name || tool.name : tool.name) + (locale === 'am' ? ' እነማ' : ' animation'));
    document.querySelectorAll('#tabs .tab').forEach(b => {
      const t = TOOLS.find(x => x && x.id === b.dataset.id);
      if (t) b.textContent = locale === 'am' ? (VAM[t.id] || {}).name || t.name : t.name;
    });
  }
  function select(tool) {
    if (!tool) return;
    cur = tool;
    document.querySelectorAll('#tabs .tab').forEach(b => b.setAttribute('aria-selected', b.dataset.id === tool.id));
    updateToolText(tool);
    buildControls(); renderRead();
    if (tool.reset) tool.reset();
    if (tool.id === 'quad') tool.reveal = 0;
  }
  $('#tabs').innerHTML = TOOLS.filter(Boolean).map(t => '<button type="button" class="tab" role="tab" data-id="' + t.id + '">' + t.name + '</button>').join('');
  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (!b) return;
    const t = TOOLS.find(x => x && x.id === b.dataset.id);
    if (t) select(t);
  });

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(50, now - last); last = now;
    background(); cur.draw(now, cur.v, dt);
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resize);
  resize(); select(quad); frame(performance.now());
  document.addEventListener('site-language-change', e => {
    locale = e.detail && e.detail.language === 'am' ? 'am' : 'en';
    try { localStorage.setItem('site_lang', locale); localStorage.setItem('lv_lang', locale); } catch (x) {}
    updateToolText(cur); buildControls(); renderRead();
  });
})();
</script>
</body></html>
